spring.application.name=catalog-service
server.port=${SERVER_PORT:8081}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/catalog}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:tunas}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:tunas}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
