services:
  catalog-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: tunas
      POSTGRES_PASSWORD: tunas
    ports:
      - "5433:5432"
    volumes:
      - catalog-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tunas -d catalog"]
      interval: 5s
      timeout: 3s
      retries: 10

  care-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: care
      POSTGRES_USER: tunas
      POSTGRES_PASSWORD: tunas
    ports:
      - "5434:5432"
    volumes:
      - care-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tunas -d care"]
      interval: 5s
      timeout: 3s
      retries: 10

  catalog-service:
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://catalog-db:5432/catalog
      SPRING_DATASOURCE_USERNAME: tunas
      SPRING_DATASOURCE_PASSWORD: tunas
    ports:
      - "8081:8081"
    depends_on:
      catalog-db:
        condition: service_healthy

  care-service:
    build:
      context: .
      dockerfile: care-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://care-db:5432/care
      SPRING_DATASOURCE_USERNAME: tunas
      SPRING_DATASOURCE_PASSWORD: tunas
      CATALOG_SERVICE_URL: http://catalog-service:8081
    ports:
      - "8082:8082"
    depends_on:
      care-db:
        condition: service_healthy
      catalog-service:
        condition: service_started

volumes:
  catalog-data:
  care-data:
