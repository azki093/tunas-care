spring.application.name=care-service
server.port=${SERVER_PORT:8082}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/care}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:tunas}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:tunas}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
services.catalog.base-url=${CATALOG_SERVICE_URL:http://localhost:8081}
